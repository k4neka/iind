# Mosquitto config for the cloud dashboard (TASK 8).
#
# Enables TWO listeners so the same broker carries both the Python services
# (plain MQTT/TCP on 1883) and the browser dashboard (MQTT-over-WebSocket on
# 9001). The WebSocket listener on 9001 is NOT enabled in a default Mosquitto
# install, which is why dashboard.html could never connect.
#
# Run the broker with:
#     mosquitto -c dashboards/mosquitto_ws.conf
#
# Then open dashboards/dashboard.html and connect MQTT-WS to <HOST>:9001
# (see dashboards/.dashboard_conn for the host(s) printed at startup).

# Plain TCP MQTT — used by the ERP, MES and dashboard_service.
listener 1883 0.0.0.0
protocol mqtt

# WebSocket MQTT — used by the browser dashboard (Paho-JS).
listener 9001 0.0.0.0
protocol websockets

# This is a local simulation broker, so anonymous access is fine.
allow_anonymous true
